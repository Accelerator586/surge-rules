# Insert into your existing [Rule] section; keep private LAN/home rules locally.
# Put cn-allow.list and proxy-allow.list BEFORE any external advertising rules.
# Put the remaining subscriptions AFTER external advertising rules.
# Keep the existing Figma-specific rules before these general service rules.
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/cn-allow.list,CN,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/proxy-allow.list,Proxy,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/reject.list,REJECT,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/ai.list,AI-Services,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/apple.list,Apple,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/parsec.list,Parsec,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/encrypted-sni.list,EncryptedSNI,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/proxy.list,Proxy,no-resolve,update-interval=3600
RULE-SET,https://raw.githubusercontent.com/Accelerator586/surge-rules/main/dist/cn.list,CN,no-resolve,update-interval=3600
FINAL,Proxy,dns-failed
