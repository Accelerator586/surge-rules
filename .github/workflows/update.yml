name: Propose upstream updates

on:
  schedule:
    - cron: '17 22 * * 0' # Monday 06:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-maintenance
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download candidates and generate reviewable changes
        run: python3 scripts/rules.py update
      - name: Validate candidate before publishing the branch
        run: |
          python3 scripts/rules.py check
          python3 -m unittest discover -s tests -v
      - name: Open or refresh update proposal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/propose.py
