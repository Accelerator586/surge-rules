name: Validate rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify source integrity and generated rules
        run: python3 scripts/rules.py check
      - name: Check routing boundaries and failed updates
        run: python3 -m unittest discover -s tests -v
